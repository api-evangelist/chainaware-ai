  also_served_at: /.well-known/agent.json
  note: >-
    Served from the API host, not the primary domain. chainaware.ai is an Angular single-page app whose router
    answers HTTP 200 with the same 7,355-byte HTML shell for every path, including both agent-card paths and a
    negative-control path that cannot exist (/.well-known/chainaware-ai-negative-control-7852a6b7.json, 200,
    7,355 bytes) — so nothing on the apex is a document. api.chainaware.ai is a different origin (Apache +
    Express behind CloudFront): it returns a real 404 for /.well-known/oauth-protected-resource, for a
    negative-control path (10 bytes) and for every other named well-known path, and returns this 10,778-byte
    application/json card — byte-identical — at BOTH /.well-known/agent-card.json (canonical) and the legacy
    /.well-known/agent.json. The MCP hosts (mcp.chainaware.ai, prediction.mcp.chainaware.ai) 404 both paths,
    although chainaware.ai/llms.txt says the card is at mcp.chainaware.ai/.well-known/agent.json; that
    statement is stale or wrong. Ownership is not in question: provider.organization is "ChainAware.ai" with
    provider.url https://chainaware.ai/, iconUrl is on chainaware.ai, documentationUrl is
    swagger.chainaware.ai, the securitySchemes description sends key buyers to chainaware.ai/pricing, and the
    five skills are the same five operations the Enterprise API Swagger publishes.
