agent_card:
  name: ChainAware.ai API
  description: >-
    On-chain wallet fraud scoring, behavioural prediction, credit trust rating, and smart contract rug pull
    detection engine. Supports ETH, BNB, BASE, POLYGON, SOLANA, TON, TRON, and HAQQ networks.
  url: https://api.chainaware.ai/api/a2a
  version: 1.0.0
  protocol_version: '0.3.0'
  preferred_transport: JSONRPC
  supported_interfaces:
  - {url: 'https://api.chainaware.ai/api/a2a', transport: JSONRPC}
  provider:
    organization: ChainAware.ai
    url: https://chainaware.ai/
  capabilities:
    streaming: false
    push_notifications: false
    state_transition_history: false
    extensions:
    - uri: https://x402.org/extension/v1
      required: false
      description: x402 HTTP payment protocol. Each API call requires an X-PAYMENT header with a valid USDC micropayment on the configured EVM network or an x-api-key in header.
      params: {protocol: x402, scheme: exact, currency: USDC, network: 'eip155:8453', receiver: '0x9e60Ca8606b39533B9E1bC460f6d0C92c16CeA08', pricePerCall: '$0.15', detailsUrl: 'https://api.chainaware.ai/api/capabilities'}
  security_schemes:
    x402Payment: {type: apiKey, in: header, name: X-PAYMENT}
    apiKey: {type: apiKey, in: header, name: x-api-key}
  security: [{x402Payment: []}, {apiKey: []}]
  default_input_modes: [application/json]
  default_output_modes: [application/json]
  icon_url: https://chainaware.ai/assets/brand/chainawareai-logo.svg
  documentation_url: https://swagger.chainaware.ai/
  skill_count: 5
  skills:
  - {id: fraud_check, name: Fraud Check, endpoint: 'POST https://api.chainaware.ai/api/fraud/check', tags: [fraud, wallet, risk, screening, blockchain], rest_operation: checkWalletFraud}
  - {id: fraud_audit, name: Wallet Audit, endpoint: 'POST https://api.chainaware.ai/api/fraud/audit', tags: [behavior, ai, wallet, prediction, profiling], rest_operation: auditWalletBehaviour}
  - {id: wallet_segment, name: Wallet Segmentation, endpoint: 'POST https://api.chainaware.ai/api/segmentation/wallet-segment', tags: [segmentation, ai, wallet, quality, classification], rest_operation: getWalletSegment}
  - {id: rug_pull, name: Rug Pull Check, endpoint: 'POST https://api.chainaware.ai/api/rug/pull-check', tags: [rug-pull, predit-rug-pull, rug-pull-check], rest_operation: checkRugPull}
  - {id: credit_score, name: Credit Score, endpoint: 'POST https://api.chainaware.ai/api/users/credit-score', tags: [defi-score, trust-score, credit-score, rug-pull, contract, defi], rest_operation: getCreditScore}
  skill_shape: >-
    Every skill carries id, name, description, tags, examples, inputModes/outputModes (application/json),
    per-skill security (x402Payment OR apiKey) and a metadata block naming the backing REST endpoint, method,
    inputSchema and outputSchema — the same five operations the Enterprise API Swagger publishes, served here
    from api.chainaware.ai/api/* instead of enterprise.api.chainaware.ai. The rest_operation column maps each
    skill to the operationId in openapi/chainaware-ai-enterprise-api-openapi.yml.
conformance:
  spec: A2A 1.0.0
  grade: conformant
  protocol_version: '0.3.0'
  preferred_transport: JSONRPC
  hard_checks:
    capabilities_is_object: true
    protocol_version_present: true
    skills_is_array: true
  optional_fields:
    preferred_transport: true
    default_input_modes: true
    default_output_modes: true
  grade_basis: >-
    capabilities is an OBJECT with streaming, pushNotifications, stateTransitionHistory and an extensions[]
    array; protocolVersion "0.3.0" is present at the top level; skills is an ARRAY of five fully-populated
    skills. All three optional discriminators are present. The card passes every hard check, so it grades
    conformant; the items below are recorded as deviations and drift, not as failures of the grade.
  deviations:
  - field: url / supportedInterfaces
    observed: 'top-level url + preferredTransport (0.3.0 shape) AND a supportedInterfaces[] array whose entries use "transport" rather than the 1.0.0 "protocolBinding"'
    note: A hybrid of the 0.3.0 and 1.0.0 shapes. A 0.3.0 reader ignores supportedInterfaces; a 1.0.0 reader finds the array but not the field name it expects. Harmless today, but neither reader sees a complete picture.
  - field: security / securityRequirements
    observed: both present with identical content, at card level and on every skill
    note: securityRequirements is not an A2A field; it duplicates security. Readers should use security.
  - field: url
    observed: https://api.chainaware.ai/api/a2a returns HTTP 404 for POST; https://api.chainaware.ai/api/a2a/ (trailing slash) answers message/send
    note: The declared endpoint is off by one character from the one that works. An A2A client that POSTs exactly what the card says will fail; one that normalises to a trailing slash will succeed.
  - field: JSON-RPC methods
    observed: message/send answers; tasks/get and agent/getAuthenticatedExtendedCard return HTTP 404 {"error":"Not found"} instead of JSON-RPC errors
    note: Unimplemented methods should surface as JSON-RPC -32601 (or A2A -32001 for an unknown task). An HTTP 404 on a routed JSON-RPC endpoint is a transport-level answer to an application-level question.
  - field: capabilities.extensions[0].required
    observed: 'false'
    note: Correct — x402 is one of two acceptable credentials (the other is x-api-key), so the extension is optional, unlike providers whose only gate is payment.
  - field: skills[].metadata.inputSchema
    observed: 'a flat property map ({field: {type, description, required, example}}) rather than a JSON Schema object'
    note: Informative and matches /api/capabilities, but it is not a JSON Schema; the Enterprise Swagger's FraudCheckRequestBody etc. are the schema-grade definitions of the same inputs.
  - field: signatures
    observed: absent
    note: No JWS signature block; the card's authenticity rests on TLS to api.chainaware.ai.
  - field: llms.txt statement of location
    observed: chainaware.ai/llms.txt says "A2A Agent Card at /.well-known/agent.json" on mcp.chainaware.ai, which 404s
    note: Documentation drift; the card lives on api.chainaware.ai.
surface_relationship:
  note: >-
    ChainAware publishes three agent-reachable surfaces that are projections of one model set. A2A: five skills
    on api.chainaware.ai, each the x402/API-key edition of an Enterprise REST operation. MCP: fourteen tools on
    prediction.mcp.chainaware.ai, of which four back onto the same REST operations and ten (batch jobs, token
    rank, token audit, ERC-8004 agent trust) have no published REST contract at all. REST: five operations on
    enterprise.api.chainaware.ai under x-api-key. The wallet_segment skill has an MCP twin only by semantics
    (predictive_behaviour returns segmentation inside a larger profile). See mcp/chainaware-ai-tool-crosswalk.yml.
