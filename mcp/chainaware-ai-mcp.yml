summary: >-
  ChainAware operates ONE hosted MCP server, reachable at two hostnames that serve the same 25,293-byte landing
  page and the same tool set: prediction.mcp.chainaware.ai (the name every provider document uses — docs,
  README, server.json, the MCP registry, AGENTS.md, SKILL.md) and mcp.chainaware.ai (the name in llms.txt and
  the site sitemap). Transport is legacy HTTP+SSE: GET /sse opens the stream and emits an endpoint event
  naming POST /messages/?session_id=<uuid>; each POST is acknowledged 202 Accepted and the JSON-RPC reply
  arrives on the stream. initialize and tools/list answered ANONYMOUSLY on 2026-09-19 — serverInfo
  {name: ChainAwareMCP, version: 1.11.0}, protocolVersion 2025-03-26, capabilities tools/prompts/resources
  (listChanged false), no instructions — returning fourteen tools with real inputSchemas (saved verbatim to
  mcp/chainaware-ai-mcp-tools.json). Authorship is unambiguous: the tool names are ChainAware products, the
  descriptions cite ChainAware accuracy claims, and the MIT-licensed FastMCP source is on the provider's
  GitHub. The declared MCP paths /mcp (Streamable HTTP) and /.well-known/oauth-protected-resource both 404 on
  both hosts; the only well-known documents the MCP hosts serve are /.well-known/x402 and /.well-known/x402.json.
deployment:
  mode: remote
  endpoint: https://prediction.mcp.chainaware.ai/sse
  alias_endpoint: https://mcp.chainaware.ai/sse
  transport: sse
  messages_endpoint: https://prediction.mcp.chainaware.ai/messages/?session_id=<from the SSE endpoint event>
  auth: api-key
  verified: probed
  note: >-
    A hosted HTTPS SSE endpoint an MCP client connects to directly. No stdio package is published on npm or
    PyPI; the documented Claude Desktop config bridges the remote server with `npx mcp-remote <sse url>
    --header "X-API-Key: ..."`, which is a client bridge, not a local server. The FastMCP source can be run
    locally (the README's example clients point at http://localhost:5000/sse) but the provider documents no
    install command for that, so mode is remote, not both. auth is api-key in three documented forms: an
    X-API-Key header on the SSE connection (Claude Code / Cursor / SDK examples), an ?apiKey= query parameter
    on the SSE URL (ChatGPT and Claude Web integrations), and — for the six tools that require it — an
    in-band `apiKey` argument inside the tool call. The connection itself, initialize and tools/list need no
    credential. Eight tools need no key at all per the provider's docs and the live schemas (token_rank_list,
    token_rank_single, run_token_audit, get_token_audit_result, agents_trust_score_list,
    agents_trust_score_single, check_job_status, get_job_results). x402 pay-per-call is declared "at the
    backend API level" (/.well-known/x402.json: backend https://api.chainaware.ai) and the README says the
    apiKey argument may be omitted when paying with x402; no OAuth metadata is served on any host.
