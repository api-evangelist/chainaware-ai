mcp_only_entities:
- name: Token (Token Rank / Token Audit)
  key: (network, contract_address)
  fields:
  - rank
  - community strength
  - top holders
  - audit aggregate.risk_score 0-100
  - aggregate.verdict CLEAN|SUSPICIOUS|HIGH RISK|HONEYPOT|THEFT|UNVERIFIABLE
  - per-module status pass|fail|warn|n/a
  source: mcp/chainaware-ai-mcp-tools.json + https://chainaware.ai/learn/token-audit/index.html
- name: ERC-8004 Agent
  key: (chain_id, agent_id)
  fields:
  - owner_address
  - agent_wallet
  - wallet_verified
  - agent_uri
  - registered_at
  - metadata_json{type,name,description,image,active,supportedTrust[]}
  - registration{agent_name,agent_desc,fetch_status}
  - wallets[]{wallet_chain_id,wallet_address,source}
  - reputation_score
  - trust_score 0-1000
  - trust_tier
  - trust_flags[]
  source: https://chainaware.ai/learn/prediction-mcp/tool-agents-trust-score-single.html
- name: Batch Job
  key: job_id + signature
  fields:
  - total_items
  - chunks_enqueued
  - status pending|processing|partial|completed
  - completed/failed/pending counts
  - result address list
  source: https://chainaware.ai/learn/prediction-mcp/tool-predictive-fraud-batch.html
relationships:
- from: RugPullResponse
  to: Wallet
  type: belongs_to
  via: contractCreatorAddress
  note: The deployer wallet whose behavioural history feeds the rug-pull score; nullable.
- from: RugPullResponse
  to: Contract
  type: has_one
  via: pairAddress
  note: The DEX liquidity pair analysed alongside the token contract.
- from: FraudCheckResponse
  to: SanctionEntry
  type: has_many
  via: sanctionData[]
  note: Zero or more sanctions-list matches {category,name,description,url,isSanctioned}.
- from: FraudCheckResponse
  to: ForensicDetails
  type: has_one
  via: forensic_details
  note: 19 string flags (cybercrime, money_laundering, mixer, sanctioned, …).
- from: WalletAuditResponse
  to: FraudCheckResponse
  type: extends
  via: shared fields status/probabilityFraud/forensic_details
  note: >-
    The audit is a superset of the fraud check plus experience, intention (14 Prob_* signals), categories[], protocols[],
    riskProfile[], recommendation, segmentInfo, userDetails.
- from: ERC-8004 Agent
  to: Wallet
  type: has_many
  via: wallets[] / owner_address / agent_wallet
  note: >-
    MCP only; the agent trust score is computed from the owner and feeder wallets, which can themselves be scored
    with predictive_fraud.
- from: Batch Job
  to: Wallet
  type: has_many
  via: result address list
  note: >-
    MCP only; results are addresses, and the per-wallet documents are fetched with the single-wallet tools.
