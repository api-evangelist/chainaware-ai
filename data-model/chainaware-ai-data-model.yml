summary: >-
  A scoring API has a thin data model: there are no server-side resources with ids, only two addressable SUBJECTS
  — a Wallet (walletAddress + network) and a Contract/pool (contract or pair address + network) — and five read-only
  score documents computed about them. Identity is the chain address itself; there are no ChainAware-minted ids,
  no id prefixes and no cross-resource links other than the addresses embedded in a rug-pull result. The MCP-only
  products add two more subjects (Token, ERC-8004 Agent) and a Batch Job, described from the tool schemas and docs
  since no OpenAPI covers them.
identity:
  wallet: (network, walletAddress) — hex address or ENS name (docs accept vitalik.eth); no provider id
  contract: (network, contract or liquidity-pool address)
  erc8004_agent: (chain_id, agent_id) — the ERC-8004 Identity Registry key (MCP only)
  batch_job: job_id (uuid) + signature (hex) — both required, neither recoverable if lost (MCP only)
