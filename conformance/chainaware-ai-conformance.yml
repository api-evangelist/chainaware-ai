  name: Model Context Protocol
  version: '2025-03-26'
  conforms: true
  evidence: 'GET https://prediction.mcp.chainaware.ai/sse opened an SSE stream with an endpoint event; initialize returned protocolVersion "2025-03-26", serverInfo {ChainAwareMCP, 1.11.0}; tools/list returned 14 tools with inputSchema (10 with outputSchema). Legacy HTTP+SSE transport, not Streamable HTTP (/mcp 404). See mcp/chainaware-ai-mcp.yml.'
