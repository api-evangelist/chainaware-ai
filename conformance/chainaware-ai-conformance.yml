summary: >-
  ChainAware's conformance profile is the agent-commerce stack plus one market-specific identifier scheme,
  not an enterprise or sector standard: an A2A 0.3.0 agent card with the x402 extension, a hosted MCP server at
  protocol 2025-03-26, JSON-RPC 2.0 on both, a live x402 v2 HTTP 402 challenge settled in USDC on Base
  (CAIP-2 eip155:8453) verified on the wire, and ERC-8004 agent identity (agent_id + chain_id, the Identity
  Registry's key) as the input contract of two MCP tools. It declares no OAuth/OIDC, no RFC 9457 problem
  details, no RFC 9116 security.txt, no RFC 9727 API catalog and no RFC 8594 sunset signalling. The
  "MiCA-aligned" language on the compliance product pages is a marketing claim about what the product helps a
  customer do, not a conformance the API contract declares, and is recorded as not asserted.
