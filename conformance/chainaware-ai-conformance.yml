- id: a2a-x402-extension
  name: x402 extension for A2A
  version: v1
  conforms: true
  evidence: 'a2a/chainaware-ai-agent-card.json capabilities.extensions[0].uri = https://x402.org/extension/v1, required false, params {protocol: x402, scheme: exact, currency: USDC, network: eip155:8453, pricePerCall: $0.15, detailsUrl: https://api.chainaware.ai/api/capabilities}; securitySchemes.x402Payment is an apiKey-in-header scheme named X-PAYMENT.'
  domain_standard_signature: true
  note: The card declares the extension URI itself — the contract-level agent-commerce signature. Optional rather than required because an x-api-key is an alternative credential.
- id: x402
  name: x402 HTTP payment protocol
  version: '2'
  conforms: true
  verification: observed
  evidence: 'POST https://api.chainaware.ai/api/fraud/check without credentials returned HTTP 402 with a `payment-required` header whose base64 body decodes to {x402Version: 2, error: "Payment required", resource: {url, description, mimeType}, accepts: [{scheme: exact, network: eip155:8453, amount: "150000", asset: 0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913, payTo: 0x9e60Ca8606b39533B9E1bC460f6d0C92c16CeA08, maxTimeoutSeconds: 300, extra: {name: USD Coin, version: "2"}}], extensions: {bazaar: {...}}} — saved decoded to a2a/chainaware-ai-x402-payment-required.json. Discovery documents at mcp.chainaware.ai/.well-known/x402.json and prediction.mcp.chainaware.ai/.well-known/x402.json ({"x402": true, "backend": "https://api.chainaware.ai"}).'
  note: The 402 challenge and its PaymentRequirements payload were both observed; no payment was made and no paid response was inspected. The asset address is the canonical USDC contract on Base and the amount (6 decimals) matches the card's $0.15.
