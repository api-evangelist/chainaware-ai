summary: >-
  ChainAware declares that rate limiting exists but publishes no number, window, scope or header for it. Every
  Enterprise API operation declares a 429 "Rate limit exceeded" response with no schema and no headers; the
  docs error table repeats the code; the MCP README says only "Rate limits may apply depending on usage tier".
  No RateLimit-*, X-RateLimit-* or Retry-After header is documented and none could be observed without a key
  (anonymous requests stop at the API Gateway edge with 403). What IS published is a set of size and time
  limits on the MCP batch and x402 surfaces, recorded below.
