aid: chainaware-ai
name: ChainAware.ai
description: >-
  ChainAware.ai is an AI-powered blockchain intelligence platform, operated by Decentral Tech OÜ (Estonia)
  with algorithms from the SmartCredit.io team, that scores wallets, tokens, smart contracts and ERC-8004 AI
  agents for fraud, rug-pull, credit and trust risk across eight blockchains (Ethereum, BNB Smart Chain,
  Polygon, Base, Solana, TON, Tron, HAQQ) using 23M+ behavioural wallet profiles. The same models are exposed
  three ways: a five-operation Enterprise REST API at enterprise.api.chainaware.ai (Swagger 2.0 published at
  swagger.chainaware.ai, x-api-key auth, Business/Enterprise subscriptions); a hosted MCP server at
  prediction.mcp.chainaware.ai/sse (14 tools, anonymous tools/list, MIT-licensed source, listed in the official
  MCP registry); and an A2A 0.3.0 agent card at api.chainaware.ai/.well-known/agent-card.json whose five skills
  are paid per call through x402 (USDC on Base, $0.15 per call) or with an API key.
