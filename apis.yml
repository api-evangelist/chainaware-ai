- aid: chainaware-ai:chainaware-a2a-x402-agent-api
  name: ChainAware A2A Agent and x402 API
  description: >-
    Agent-facing surface on api.chainaware.ai: an A2A 0.3.0 agent card at /.well-known/agent-card.json
    (also at the legacy /.well-known/agent.json) declaring five skills — fraud_check, fraud_audit, wallet_segment,
    rug_pull, credit_score — each bound to a POST endpoint under https://api.chainaware.ai/api/ and paid
    either with an x-api-key or per call through the x402 extension (USDC on Base, eip155:8453, $0.15
    per call). The JSON-RPC endpoint answers message/send at /api/a2a/ (the card's declared /api/a2a without
    the trailing slash 404s, as do tasks/get and agent/getAuthenticatedExtendedCard). An unauthenticated
    POST to /api/fraud/check returns a live HTTP 402 with an x402 v2 PaymentRequirements header, and /api/capabilities
    publishes a machine-readable capabilities document with per-call pricing.
  humanURL: https://chainaware.ai/x402-payment
  baseURL: https://api.chainaware.ai/api
