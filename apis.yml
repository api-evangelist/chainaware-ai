apis:
- aid: chainaware-ai:chainaware-prediction-mcp-server
  name: ChainAware Behavioural Prediction MCP Server
  description: >-
    Hosted Model Context Protocol server over Server-Sent Events at https://prediction.mcp.chainaware.ai/sse
    (https://mcp.chainaware.ai/sse serves the same server; messages are POSTed to /messages/?session_id=...).
    initialize and tools/list answer anonymously — serverInfo ChainAwareMCP 1.11.0, protocol 2025-03-26
    — with 14 tools carrying real inputSchemas: predictive_fraud, predictive_behaviour, predictive_rug_pull,
    credit_score (and their batch variants plus check_job_status / get_job_results), token_rank_list,
    token_rank_single, run_token_audit, get_token_audit_result, agents_trust_score_list and agents_trust_score_single.
    Six tools take the API key as an in-band apiKey argument (or X-API-Key header); eight need no key.
    Source is MIT-licensed on GitHub and the server is listed in the official MCP registry as io.github.ChainAware/chainaware-behavioral-prediction-mcp.
  humanURL: https://chainaware.ai/learn/prediction-mcp/index.html
